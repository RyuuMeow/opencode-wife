name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is-tag: ${{ steps.check.outputs.is-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "::error::Tag ${TAG} does not match packages/desktop version ${VERSION}"
              exit 1
            fi
            echo "is-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check supported OpenCode base version
        shell: bash
        run: |
          if ! grep -q 'OPENCODE_BASE_VERSION = "1.18.14"' packages/desktop/src/main/shared-agent-data.ts; then
            echo "::error::OPENCODE_BASE_VERSION changed; update this workflow and the release notes"
            exit 1
          fi

  build:
    name: Build Windows x64 installer
    needs: validate
    runs-on: windows-latest
    env:
      OPENCODE_CHANNEL: prod
    steps:
      - uses: actions/checkout@v4
      # Restored bun caches collide with fresh downloads on Windows (ENOTEMPTY
      # while applying patches), so this job installs without the cache step.
      - uses: oven-sh/setup-bun@2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --linker hoisted

      - name: Build sidecar and copy resources
        working-directory: packages/desktop
        run: bun ./scripts/prebuild.ts

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package Windows installer
        working-directory: packages/desktop
        run: bun run package:win

      - name: Verify no proprietary or upstream update content
        shell: bash
        working-directory: packages/desktop
        run: |
          if grep -rilE "anomalyco/opencode|opencode-beta|app-update\.yml|electron-builder\.yml" out; then
            echo "::error::Upstream publish or update references found in the built app"
            exit 1
          fi
          # The proprietary Cubism core never ships: it must not exist in the repo
          # (it is gitignored), in the built renderer, or in the packaged app.
          if find ../../packages/app/public dist/win-unpacked -iname "*cubism*" 2>/dev/null | grep .; then
            echo "::error::Live2D Cubism core found in repo or packaged app"
            exit 1
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: packages/desktop
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-wife-windows-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft prerelease
        if: needs.validate.outputs.is-tag == 'true'
        shell: bash
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          NOTES=$(printf '%s\n' \
            "## OpenCode Wife ${{ needs.validate.outputs.version }}" \
            "" \
            "- Windows x64 NSIS installer (unsigned; Windows SmartScreen will warn — verify the SHA-256 checksum before running)." \
            "- Side-by-side install with OpenCode is supported, but only one app may run at a time (shared Agent state)." \
            "- Compatible OpenCode base version: 1.18.14." \
            "- Live2D Cubism Core is not bundled; install it from Settings → Wife → Live2D runtime." \
            "- Automatic updates are disabled in this alpha.")
          gh release create "$GITHUB_REF_NAME" \
            --draft --prerelease \
            --title "OpenCode Wife ${{ needs.validate.outputs.version }}" \
            --notes "$NOTES" \
            *.exe SHA256SUMS.txt
